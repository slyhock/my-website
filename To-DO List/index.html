<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List</title>
  <style>
    body {
  font-family: sans-serif;
  background: #f0f4ff;
  display: flex;
  justify-content: center;
  padding: 40px;
  margin: 0;
}

.container {
  background: white;
  padding: 32px;
  border-radius: 12px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

h1 {
  color: #4f46e5;
  margin-bottom: 20px;
}

.input-row {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}

input {
  flex: 1;
  padding: 10px 14px;
  font-size: 16px;
  border: 2px solid #e0e7ff;
  border-radius: 8px;
  outline: none;
}

input:focus {
  border-color: #4f46e5;
}

button {
  padding: 10px 20px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

button:hover { background: #4338ca; }

ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  margin-bottom: 8px;
  background: #f8faff;
  border-radius: 8px;
  border: 1px solid #e0e7ff;
  cursor: pointer;
}

li.done span {
  text-decoration: line-through;
  color: #aaa;
}

.delete-btn {
  background: none;
  color: #e11d48;
  font-size: 18px;
  padding: 0 6px;
  border: none;
  cursor: pointer;
}

.delete-btn:hover {
  background: none;
  color: #be123c;
}
  </style>
</head>
<body>

  <div class="container">
    <h1>My To-Do List</h1>

    <!-- Input area -->
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button onclick="addTask()">Add</button>
    </div>

    <!-- Tasks will appear here -->
    <ul id="taskList"></ul>
  </div>

  <script>
    // Load tasks from Local Storage, or start with empty array
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

// Save tasks to Local Storage
function saveTasks() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

// Render all tasks to the screen
function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";  // clear the list first

  tasks.forEach(function(task, index) {
    // Create the <li> element
    const li = document.createElement("li");
    if (task.done) li.classList.add("done");

    // Create the task text
    const span = document.createElement("span");
    span.textContent = task.text;

    // Toggle done when clicking the text
    li.onclick = function() {
      tasks[index].done = !tasks[index].done;
      saveTasks();
      renderTasks();
    };

    // Create delete button
    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "✕";
    deleteBtn.classList.add("delete-btn");
    deleteBtn.onclick = function(e) {
      e.stopPropagation();        // prevents li.onclick from also firing
      tasks.splice(index, 1);     // removes 1 item at this index
      saveTasks();
      renderTasks();
    };

    // Assemble the <li>
    li.appendChild(span);
    li.appendChild(deleteBtn);
    list.appendChild(li);
  });
}

// Add a new task
function addTask() {
  const input = document.getElementById("taskInput");
  const text = input.value.trim();   // .trim() removes accidental spaces

  if (text === "") return;           // don't add empty tasks

  tasks.push({ text: text, done: false });
  input.value = "";                  // clear the input field
  saveTasks();
  renderTasks();
}

// Allow pressing Enter to add a task
document.getElementById("taskInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") addTask();
});

// Run once on load
renderTasks();
  </script>

</body>
</html>
